name: Testes no browser

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar fluxos base no browser
        run: |
          npm run e2e:serve > vite-e2e.log 2>&1 &
          npm run test:e2e

      - name: Guardar provas de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-e2e-failure
          path: |
            cypress/screenshots/
            cypress/videos/
            vite-e2e.log
          if-no-files-found: ignore
          retention-days: 14
